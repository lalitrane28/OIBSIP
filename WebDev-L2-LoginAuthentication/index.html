<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Authentication</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="page-bg">
            <div class="shape shape--one"></div>
            <div class="shape shape--two"></div>
        </div>

        <main class="auth-wrap" aria-labelledby="welcomeTitle">
            <section class="card card--split">
                <div class="card-grid">
                    <aside class="card-illustration" aria-hidden="true">
                        <!-- unique abstract illustration -->
                        <svg viewBox="0 0 600 600" class="blob" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="g1" x1="0" x2="1">
                                    <stop offset="0" stop-color="#7c3aed" />
                                    <stop offset="1" stop-color="#06b6d4" />
                                </linearGradient>
                            </defs>
                            <g transform="translate(300,300)">
                                <path d="M120,-160C156,-128,182,-92,192,-50C202,-8,196,40,172,82C148,124,106,160,64,179C22,197,-20,198,-62,181C-104,164,-146,129,-168,84C-190,39,-192,-18,-168,-60C-144,-101,-96,-127,-52,-156C-8,-185,28,-216,72,-206C116,-196,84,-192,120,-160Z" fill="url(#g1)" opacity="0.95"/>
                            </g>
                        </svg>
                        <div class="illus-caption">Secure • Fast • Friendly</div>
                    </aside>

                    <div class="card-form">
                        <header class="card-header">
                            <h1 id="welcomeTitle">Welcome Back <span class="wave">👋</span></h1>
                            <p class="subtitle">Nice to see you again — sign in to continue</p>
                        </header>

                        <form id="loginForm" class="form" novalidate>
                            <label class="field">
                                <span class="field-label">Email</span>
                                <div class="input-icon">
                                    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2 4.5A2.5 2.5 0 014.5 2h15A2.5 2.5 0 0122 4.5v15a2.5 2.5 0 01-2.5 2.5h-15A2.5 2.5 0 012 19.5v-15zM4.5 5L12 10l7.5-5H4.5zM20 19V7.1l-8 5.3L4 7v12h16z"/></svg>
                                    <input type="email" id="loginEmail" placeholder="you@company.com" required autocomplete="username" />
                                </div>
                            </label>

                            <label class="field">
                                <span class="field-label">Password</span>
                                <div class="input-icon">
                                    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 8V7a5 5 0 10-10 0v1H5v13h14V8h-2zM9 7a3 3 0 116 0v1H9V7z"/></svg>
                                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                                </div>
                            </label>

                            <div class="actions">
                                <button type="submit" class="btn btn--primary full">Sign in</button>
                                <a class="btn btn--ghost" href="register.html">Create account</a>
                            </div>

                            <div id="loginMessage" class="msg" aria-live="polite"></div>
                        </form>

                        <footer class="card-foot">
                            <small class="muted">By signing in you agree to the Terms and Privacy.</small>
                        </footer>
                    </div>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
