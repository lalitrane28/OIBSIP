<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-bg">
      <div class="shape shape--one"></div>
      <div class="shape shape--two"></div>
    </div>

    <main class="auth-wrap" aria-labelledby="registerTitle">
      <section class="card card--split">
        <div class="card-grid">
          <aside class="card-illustration small-illus" aria-hidden="true">
            <svg viewBox="0 0 600 600" class="blob" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="g2" x1="0" x2="1">
                  <stop offset="0" stop-color="#06b6d4" />
                  <stop offset="1" stop-color="#7c3aed" />
                </linearGradient>
              </defs>
              <g transform="translate(300,300)">
                <path d="M120,-160C156,-128,182,-92,192,-50C202,-8,196,40,172,82C148,124,106,160,64,179C22,197,-20,198,-62,181C-104,164,-146,129,-168,84C-190,39,-192,-18,-168,-60C-144,-101,-96,-127,-52,-156C-8,-185,28,-216,72,-206C116,-196,84,-192,120,-160Z" fill="url(#g2)" opacity="0.95"/>
              </g>
            </svg>
          </aside>

          <div class="card-form">
            <header class="card-header">
              <h1 id="registerTitle">Create Account <span class="spark">✨</span></h1>
              <p class="subtitle">Register to get started — it's quick and free</p>
            </header>

            <form id="registerForm" class="form" novalidate>
              <label class="field">
                <span class="field-label">Full name</span>
                <div class="input-icon">
                  <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                  <input type="text" id="registerName" placeholder="Full name" required autocomplete="name" />
                </div>
              </label>

              <label class="field">
                <span class="field-label">Email</span>
                <div class="input-icon">
                  <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2 4.5A2.5 2.5 0 014.5 2h15A2.5 2.5 0 0122 4.5v15a2.5 2.5 0 01-2.5 2.5h-15A2.5 2.5 0 012 19.5v-15zM4.5 5L12 10l7.5-5H4.5zM20 19V7.1l-8 5.3L4 7v12h16z"/></svg>
                  <input type="email" id="registerEmail" placeholder="you@company.com" required autocomplete="email" />
                </div>
              </label>

              <label class="field">
                <span class="field-label">Password</span>
                <div class="input-icon">
                  <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 8V7a5 5 0 10-10 0v1H5v13h14V8h-2zM9 7a3 3 0 116 0v1H9V7z"/></svg>
                  <input type="password" id="registerPassword" placeholder="Create a password" required autocomplete="new-password" />
                </div>
              </label>

              <label class="field">
                <span class="field-label">Confirm password</span>
                <div class="input-icon">
                  <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
                  <input type="password" id="confirmPassword" placeholder="Confirm password" required />
                </div>
              </label>

              <div class="actions">
                <button type="submit" class="btn btn--primary full">Create account</button>
                <a class="btn btn--ghost" href="index.html">Already have an account</a>
              </div>

              <div id="registerMessage" class="msg" aria-live="polite"></div>
            </form>

            <footer class="card-foot"><small class="muted">We respect your privacy — no spam.</small></footer>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
